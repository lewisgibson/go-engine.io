name: Test

on:
    workflow_dispatch: {}

    push:
        branches:
            - main

    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6.0.3

            - name: Setup Go
              uses: actions/setup-go@v6.4.0
              with:
                  go-version-file: ./go.mod
                  cache: true

            - name: Verify Modules
              run: go mod verify

            - name: Test
              run: make unit-test

            - name: Upload Coverage to Codecov
              uses: codecov/codecov-action@v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage/unit.cov
                  # Fail the build if the upload errors, so a broken Codecov
                  # integration surfaces instead of being silently ignored.
                  fail_ci_if_error: true
